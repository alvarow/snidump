name: Build pfSense package

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build binaries and package on FreeBSD 15
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y pcre2
          run: |
            set -e
            # Compile binaries
            make CC=clang \
                 CFLAGS="-I/usr/local/include" \
                 LDFLAGS="-L/usr/local/lib"
            # Stage into the builds directory make pkg-build expects
            cp bin/snidump bin/snidump_noether builds/amd64/freebsd-15/
            # Build the .pkg
            make pkg-build

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfSense-pkg-snidump
          path: pkg/work/pkg/pfSense-pkg-snidump-*.pkg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/work/pkg/pfSense-pkg-snidump-*.pkg
          body: |
            Install on pfSense — copy the `.pkg` URL from Assets below:
            ```sh
            pkg add <url>
            ```
